name: Synchronize four-way intelligence HTML preview

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_preview_assets.py'
      - 'preview/v12/motion_social.js'
      - 'preview/v12/motion_social.css'
      - '.github/workflows/sync-v13-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cg-v13-standalone-preview-sync
  cancel-in-progress: false

jobs:
  sync_and_publish_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replace embedded motion graph and styles without touching other modules
        run: python3 scripts/sync_preview_assets.py
      - name: Run complete source and syntax QA
        run: node scripts/qa_v12_preview.cjs
      - name: Commit the updated standalone preview HTML to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/v12/index.html
          if git diff --cached --quiet; then
            echo "HTML is already synchronized"
            exit 0
          fi
          git commit -m "preview: deploy interactive four-dimension social intelligence flow"
          git pull --rebase origin main
          git push origin HEAD:main
