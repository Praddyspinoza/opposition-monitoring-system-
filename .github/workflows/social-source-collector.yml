name: Collect public social-source references

on:
  schedule:
    - cron: '30 1 * * *'  # Target 07:00 IST, subject to GitHub Actions queueing
    - cron: '30 11 * * *' # Target 17:00 IST
  workflow_dispatch:
  push:
    branches:
      - 'feature/social-evidence-x-meta-v11'
    paths:
      - 'scripts/collect_social_sources.py'
      - '.github/workflows/social-source-collector.yml'

permissions:
  contents: write

concurrency:
  group: social-source-collector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-source-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect rate-limited public news leads and optionally authorized X posts
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python3 scripts/collect_social_sources.py
      - name: Commit source ledger updates to the current branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social_updates.json data/verified_x_posts.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          git commit -m "data: refresh public social leads and authorized X archive [source collector]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
