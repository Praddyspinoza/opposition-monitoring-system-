name: Verify district atlas
on:
  push:
    branches:
      - 'feature/33-district-activity-map-v7'
      - 'feature/district-timeline-v8'
      - 'feature/33-district-ten-leader-five-topic-dossiers'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Node & DOM smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Run district atlas smoke checks
        run: node qa/smoke.mjs

  browser:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: Interactive Chromium UI across devices
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify district dossiers on desktop, iPad and mobile
        run: node tests/dossier-browser-smoke.cjs
      - name: Save browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chhattisgarh-district-browser-checks
          path: tests/v9-*.png
          if-no-files-found: ignore
