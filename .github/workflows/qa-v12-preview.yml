name: V12 preview integrity and browser smoke test

on:
  push:
    branches: [main]
    paths:
      - 'preview/v12/**'
      - 'scripts/qa_v12_preview.cjs'
      - 'scripts/qa_v13_interactions.cjs'
      - 'scripts/sync_preview_assets.py'
      - '.github/workflows/qa-v12-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static_and_browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize the inline preview for QA without modifying GitHub
        run: python3 scripts/sync_preview_assets.py
      - name: Validate research source counts, dates, data integrity and script syntax
        run: node scripts/qa_v12_preview.cjs
      - name: Verify public post extractor without network requests
        run: python3 scripts/discover_issue_posts.py --self-test
      - name: Headless browser smoke test where Chrome is available
        shell: bash
        run: |
          set -euo pipefail
          BIN=""
          for B in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$B" >/dev/null 2>&1; then BIN=$(command -v "$B"); break; fi
          done
          if [ -z "$BIN" ]; then echo "Chrome not installed on runner; static QA passed; browser test skipped"; exit 0; fi
          echo "Testing with $BIN"
          timeout 65 "$BIN" --no-sandbox --headless --disable-gpu --hide-scrollbars             --disable-extensions --virtual-time-budget=6000 --dump-dom             "file://$PWD/preview/v12/index.html" > /tmp/v12-rendered-dom.html 2>/tmp/v12-chrome.log
          node - <<'NODE'
          const fs=require('fs');
          const assert=require('assert/strict');
          const html=fs.readFileSync('/tmp/v12-rendered-dom.html','utf8');
          for(const token of ['v12-ready','data-v13-kind="bjp"','data-v13-kind="opp"',
            'data-v13-kind="issue"','data-v13-kind="district"',
            'v12-person-card','v13Evidence','Open original post']) {
            assert(html.includes(token),'Browser did not render expected UI token '+token);
          }
          const nodes=(html.match(/data-v13-kind="(?:bjp|opp)"/g)||[]).length;
          const posts=(html.match(/Open original post/g)||[]).length;
          assert(nodes>=20,'Expected both ten BJP and ten opposition leader nodes');
          assert(posts>=24,'Expected at least the 24 embedded publisher-recovered CM X post links');
          console.log('PASS browser smoke: '+nodes+' flow nodes; '+posts+' original X link buttons in rendered DOM');
          NODE
      - name: Test simultaneous BJP, opposition, issue and district clicks in Chromium
        run: node scripts/qa_v13_interactions.cjs
      - name: Upload browser debug log only on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v12-browser-debug
          path: /tmp/v12-chrome.log
          if-no-files-found: ignore
