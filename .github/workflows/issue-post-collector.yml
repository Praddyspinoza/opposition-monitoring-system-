name: Discover leader-issue social post URLs

on:
  schedule:
    - cron: '0 2 * * *'   # Intended 07:30 IST; GitHub may delay scheduled starts
    - cron: '0 12 * * *'  # Intended 17:30 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-post-discovery
  cancel-in-progress: false

jobs:
  scan-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test link parsing without network
        run: python3 scripts/discover_issue_posts.py --self-test
      - name: Search public RSS and permitted publisher pages by leader and issue
        env:
          ISSUE_QUERY_BUDGET: "32"
        run: python3 scripts/discover_issue_posts.py
      - name: Commit post ledger, pending reviews and discovery cursor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/v12/social_intelligence_posts.json data/issue_post_candidates.json data/issue_discovery_progress.json
          if git diff --cached --quiet; then
            echo "No new source changes"
            exit 0
          fi
          git commit -m "data: advance public leader issue post permalink collection"
          git pull --rebase origin main
          git push origin HEAD:main
